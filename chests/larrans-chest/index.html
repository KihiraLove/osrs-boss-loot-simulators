<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100d">
  <meta name="description" content="Larran's Chest loot simulator and dry calculator for Old School RuneScape.">
  <title>Larran's Chest | Loot Simulator</title>
  <link rel="icon" type="image/png" href="../../assets/items/chest-larrans.png">
  <link rel="stylesheet" href="../../styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body class="chest-calculator">
  <header data-simulator-header data-title="Larran's Chest" data-icon="chest-larrans"></header>
  <div class="mode-switch" role="group" aria-label="Calculator mode">
    <button type="button" id="mode-loot" class="mode-button is-active" aria-pressed="true">Loot simulator</button>
    <button type="button" id="mode-dry" class="mode-button" aria-pressed="false">Dry calculator</button>
  </div>
  <main id="main" class="layout">
    <section class="panel controls-panel" aria-labelledby="plan-heading">
      <div class="section-heading"><h2 id="plan-heading">Your openings</h2></div>
      <form id="simulator-form" novalidate>
        <label class="depth-field count-field"><span>Completed openings</span>
          <input id="opening-count" type="number" min="0" max="1000000" step="1" value="100" inputmode="numeric">
        </label>
        <label id="fishing-field" class="depth-field count-field"><span>Fishing level</span><input id="fishing-level" type="number" min="1" max="99" step="1" value="99" inputmode="numeric"></label>
        <div id="dry-fields" class="dry-fields" hidden>
          <h3>Rewards obtained</h3>
          <div id="dry-inputs" class="dry-inputs"></div>
        </div>
        <p id="validation-message" class="validation-message" role="alert" hidden></p>
        <div class="action-row">
          <button type="submit" class="primary-action"><span id="action-label">Simulate loot</span> <span aria-hidden="true">→</span></button>
          <button type="button" class="secondary-action" id="clear-button">Clear</button>
        </div>
      </form>
    </section>
    <section id="loot-panel" class="panel overview-panel" aria-labelledby="results-heading">
      <div class="section-heading"><h2 id="results-heading">Your loot</h2></div>
      <div id="empty-state" class="empty-state">
        <div class="empty-orb"><img src="../../assets/items/chest-larrans.png" alt="" width="62" height="62"></div>
        <h3>Nothing claimed yet</h3>
        <p>Enter completed openings to simulate your rewards.</p>
      </div>
      <div id="results-content" hidden>
        <p id="results-summary" class="muted" role="status"></p>
        <div class="subheading"><h3>Notable rewards</h3></div>
        <div id="unique-grid" class="unique-grid"></div>
        <div id="collected-heading" class="subheading inventory-title"><h3>Collected loot</h3></div>
        <div id="loot-grid" class="loot-grid"></div>
      </div>
    </section>
    <section id="dry-panel" class="panel dry-panel" aria-labelledby="dry-heading" hidden>
      <div class="section-heading"><h2 id="dry-heading">Dry calculator results</h2></div>
      <div id="dry-empty" class="empty-state">
        <div class="empty-orb"><img src="../../assets/items/chest-larrans.png" alt="" width="62" height="62"></div>
        <h3>How lucky are your rewards?</h3>
        <p>Enter completed openings and individual item quantities received to calculate the odds.</p>
      </div>
      <div id="dry-results" hidden><div id="dry-results-grid" class="dry-results-grid"></div></div>
    </section>
  </main>
  <footer data-wiki-links="https://oldschool.runescape.wiki/w/Larran%27s_big_chest"></footer>
</body>
</html>
