<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#11100d">
<meta name="description" content="Dagannoth Rex, Prime and Supreme loot simulator and dry calculator, with separate kill counts and loot inventories.">
<title>Dagannoth Kings | Loot Simulator</title>
<link rel="icon" type="image/png" href="../../assets/items/pet-dagannoth-prime.png">
<link rel="stylesheet" href="../../styles.css">
<script type="module" src="app.mjs"></script>
</head>
<body class="boss-dagannoth-kings">
<header data-simulator-header data-title="Dagannoth Kings" data-icon="pet-dagannoth-prime"></header>
<div class="mode-switch" role="group" aria-label="Calculator mode">
<button type="button" id="mode-loot" class="mode-button is-active" aria-pressed="true">Loot simulator</button>
<button type="button" id="mode-dry" class="mode-button" aria-pressed="false">Dry calculator</button>
</div>
<main id="main" class="layout">
<section class="panel controls-panel" aria-labelledby="plan-heading">
<div class="section-heading"><h2 id="plan-heading">Your kills</h2></div>
<form id="simulator-form" novalidate>
<div class="king-kills">
<label class="depth-field count-field"><span>Dagannoth Rex</span><input id="kills-rex" type="number" min="0" max="1000000" step="1" value="100" inputmode="numeric"></label>
<label class="depth-field count-field"><span>Dagannoth Prime</span><input id="kills-prime" type="number" min="0" max="1000000" step="1" value="100" inputmode="numeric"></label>
<label class="depth-field count-field"><span>Dagannoth Supreme</span><input id="kills-supreme" type="number" min="0" max="1000000" step="1" value="100" inputmode="numeric"></label>
</div>
<div class="king-options">
<label class="calculator-option"><input id="hard-cas" type="checkbox"> Hard Combat Achievements</label>
<label class="calculator-option"><input id="elite-cas" type="checkbox"> Elite Combat Achievements</label>
</div>
<div id="dry-fields" class="dry-fields" hidden><h3>Drops obtained</h3><div id="dry-inputs" class="dry-inputs"></div></div>
<label class="calculator-option" data-ring-option><input id="ring-of-wealth" type="checkbox"> Ring of wealth</label>
        <p id="validation-message" class="validation-message" role="alert" hidden></p>
<div class="action-row">
<button type="submit" class="primary-action"><span id="action-label">Simulate loot</span> <span aria-hidden="true">→</span></button>
<button type="button" class="secondary-action" id="clear-button">Clear</button>
</div>
</form>
</section>
<section id="loot-panel" class="panel overview-panel" aria-labelledby="results-heading">
<div class="section-heading"><h2 id="results-heading">Your loot</h2></div>
<div id="empty-state" class="empty-state">
<div class="empty-orb"><img src="../../assets/items/pet-dagannoth-prime.png" alt="" width="62" height="62"></div>
<h3>Nothing claimed yet</h3><p>Enter kills for each king to simulate their loot separately.</p>
</div>
<div id="loot-result" hidden></div>
</section>
<section id="dry-panel" class="panel dry-panel" aria-labelledby="dry-heading" hidden>
<div class="section-heading"><h2 id="dry-heading">Dry calculator results</h2></div>
<div id="dry-empty" class="empty-state">
<div class="empty-orb"><img src="../../assets/items/pet-dagannoth-prime.png" alt="" width="62" height="62"></div>
<h3>How lucky are your drops?</h3><p>Enter the number of rare drops obtained from each king.</p>
</div>
<div id="dry-result" hidden></div>
</section>
</main>
<footer data-wiki-links="https://oldschool.runescape.wiki/w/Dagannoth_Kings"></footer>
</body>
</html>
