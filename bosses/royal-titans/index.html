<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100d">
  <meta name="description" content="Royal Titans loot simulator and dry calculator with combined solo and 50% duo contribution-adjusted loot.">
  <title>Royal Titans | Loot Simulator</title>
  <link rel="icon" type="image/png" href="../../assets/items/bran.png">
  <link rel="stylesheet" href="../../styles.css">
  <script type="module" src="app.mjs"></script>
</head>
<body class="boss-royal-titans">
  <header data-simulator-header data-title="Royal Titans" data-icon="bran"></header>
  <div class="mode-switch" role="group" aria-label="Calculator mode">
    <button type="button" id="mode-loot" class="mode-button is-active" aria-pressed="true">Loot simulator</button>
    <button type="button" id="mode-dry" class="mode-button" aria-pressed="false">Dry calculator</button>
  </div>
  <main id="main" class="layout">
    <section class="panel controls-panel" aria-labelledby="plan-heading">
      <div class="section-heading"><h2 id="plan-heading">Your kills</h2></div>
      <form id="simulator-form" novalidate>
        <div class="huey-kills">
          <label class="depth-field phosani-kills"><span>Solo (100%)</span><input id="kills-solo" type="number" min="0" max="1000000" step="1" value="100" inputmode="numeric" aria-label="Royal Titans solo kills"></label>
          <label class="depth-field phosani-kills"><span>Duo (50%)</span><input id="kills-duo" type="number" min="0" max="1000000" step="1" value="0" inputmode="numeric" aria-label="Royal Titans duo kills"></label>
        </div>
        <label class="depth-field"><span>Loot target for solo kills</span>
          <select id="solo-titan" aria-label="Solo loot target"><option value="branda">Branda the Fire Queen</option><option value="eldric">Eldric the Ice King</option></select>
        </label>
        <label class="depth-field"><span>Loot target for duo kills</span>
          <select id="duo-titan" aria-label="Duo loot target"><option value="branda">Branda the Fire Queen</option><option value="eldric">Eldric the Ice King</option></select>
        </label>
        <label class="depth-field"><span>Reward choice</span>
          <select id="reward-action" aria-label="Reward choice"><option value="loot">Loot (unique or two ordinary rolls)</option><option value="sacrifice">Sacrifice (double pet odds)</option><option value="pages">Take desiccated pages</option></select>
        </label>
        <label class="phosani-option"><input id="hard-cas" type="checkbox"> Hard Combat Achievements</label>
        <label class="phosani-option"><input id="elite-cas" type="checkbox"> Elite Combat Achievements</label>
        <label class="phosani-option"><input id="read-mystic" type="checkbox"> Mystic vigour prayer scroll already read</label>
        <label class="phosani-option"><input id="read-deadeye" type="checkbox"> Deadeye prayer scroll already read</label>
        <div id="dry-fields" class="dry-fields" hidden>
          <h3>Drops obtained</h3>
          <div id="dry-inputs" class="dry-inputs"></div>
        </div>
        <p id="validation-message" class="validation-message" role="alert" hidden></p>
        <div class="action-row">
          <button type="submit" class="primary-action" id="simulate-button"><span id="action-label">Simulate loot</span> <span aria-hidden="true">→</span></button>
          <button type="button" class="secondary-action" id="clear-button">Clear</button>
        </div>
      </form>
    </section>
    <section id="loot-panel" class="panel overview-panel" aria-labelledby="results-heading">
      <div class="section-heading"><h2 id="results-heading">Your loot</h2></div>
      <div id="empty-state" class="empty-state">
        <div class="empty-orb"><img src="../../assets/items/bran.png" alt="" width="62" height="62"></div>
        <h3>Nothing claimed yet</h3>
        <p>Enter solo and duo kills to simulate combined loot.</p>
      </div>
      <div id="results-content" hidden>
        <div class="subheading"><h3>Unique rewards</h3></div>
        <div id="unique-grid" class="unique-grid"></div>
        <p id="mode-summary" class="vestige-progress" aria-live="polite"></p>
        <div class="subheading inventory-title"><h3>Collected loot</h3></div>
        <div id="loot-grid" class="loot-grid"></div>
      </div>
    </section>
    <section id="dry-panel" class="panel dry-panel" aria-labelledby="dry-heading" hidden>
      <div class="section-heading"><h2 id="dry-heading">Dry calculator results</h2></div>
      <div id="dry-empty" class="empty-state">
        <div class="empty-orb"><img src="../../assets/items/bran.png" alt="" width="62" height="62"></div>
        <h3>How lucky are your drops?</h3>
        <p>Enter your kill count and the number of each rare drop received to calculate the odds.</p>
      </div>
      <div id="dry-results" hidden><div id="dry-results-grid" class="dry-results-grid"></div></div>
    </section>
  </main>
  <footer data-wiki-links="https://oldschool.runescape.wiki/w/The_Royal_Titans"></footer>
</body>
</html>
