name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fallback when API-authenticated writes do not generate a push workflow.
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check published revision
        id: revision
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An absent marker means this deployment predates revision tracking.
          deployed="$(curl -fsSL --retry 1 --max-time 10 \
            -H 'Cache-Control: no-cache' \
            "https://kihiralove.github.io/osrs-boss-loot-simulators/deployment-revision.txt?sha=$GITHUB_SHA" 2>/dev/null || true)"
          if [[ "$deployed" == "$GITHUB_SHA" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "The current main commit is already deployed."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is behind main; deploying."
          fi
      - uses: actions/checkout@v4
        if: steps.revision.outputs.deploy == 'true'
      - uses: actions/setup-node@v4
        if: steps.revision.outputs.deploy == 'true'
        with:
          node-version: '22'
      - name: Validate
        if: steps.revision.outputs.deploy == 'true'
        run: |
          node --test tests/*.test.mjs
          node --check simulator.mjs
          node --check app.mjs
          node --check phosani/simulator.mjs
          node --check phosani/dry-calc.mjs
          node --check phosani/app.mjs
          node --check yama/simulator.mjs
          node --check yama/dry-calc.mjs
          node --check yama/app.mjs
          node --check hydra/simulator.mjs
          node --check hydra/dry-calc.mjs
          node --check hydra/app.mjs
          node --check cerberus/simulator.mjs
          node --check cerberus/dry-calc.mjs
          node --check cerberus/app.mjs
          node --check mad-angel/simulator.mjs
          node --check mad-angel/dry-calc.mjs
          node --check mad-angel/app.mjs
          node --check sire/simulator.mjs
          node --check sire/dry-calc.mjs
          node --check sire/app.mjs
          node --check amoxliatl/simulator.mjs
          node --check amoxliatl/dry-calc.mjs
          node --check amoxliatl/app.mjs
          node --check araxxor/simulator.mjs
          node --check araxxor/dry-calc.mjs
          node --check araxxor/app.mjs
          node --check barrows/simulator.mjs
          node --check barrows/dry-calc.mjs
          node --check barrows/app.mjs
          node --check brutus/simulator.mjs
          node --check brutus/dry-calc.mjs
          node --check brutus/app.mjs
          node --check bryophyta/simulator.mjs
          node --check bryophyta/dry-calc.mjs
          node --check bryophyta/app.mjs
          node --check obor/simulator.mjs
          node --check obor/dry-calc.mjs
          node --check obor/app.mjs
          node --check callisto-artio/simulator.mjs
          node --check callisto-artio/dry-calc.mjs
          node --check callisto-artio/app.mjs
          node --check venenatis-spindel/simulator.mjs
          node --check venenatis-spindel/dry-calc.mjs
          node --check venenatis-spindel/app.mjs
          node --check vetion-calvarion/simulator.mjs
          node --check vetion-calvarion/dry-calc.mjs
          node --check vetion-calvarion/app.mjs
          node --check kalphite-queen/simulator.mjs
          node --check kalphite-queen/dry-calc.mjs
          node --check kalphite-queen/app.mjs
      - name: Record published revision
        if: steps.revision.outputs.deploy == 'true'
        run: printf '%s\n' "$GITHUB_SHA" > deployment-revision.txt
      - uses: actions/configure-pages@v5
        if: steps.revision.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.revision.outputs.deploy == 'true'
        with:
          path: '.'
      - id: deployment
        if: steps.revision.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
