<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11100d">
  <meta name="description" content="Choose an Old School RuneScape boss to simulate loot.">
  <title>OSRS Boss Loot Simulators</title>
  <link rel="icon" type="image/png" href="./assets/items/dom.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="boss-selection-page">
  <main class="boss-picker" aria-label="Select a boss simulator">
    <a class="boss-tile" href="./doom/" aria-label="Open Doom of Mokhaiotl loot simulator" title="Doom of Mokhaiotl">
      <img src="./assets/items/dom.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./phosani/" aria-label="Open Phosani's Nightmare loot simulator" title="Phosani's Nightmare">
      <img src="./assets/items/little-nightmare.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./yama/" aria-label="Open Yama loot simulator" title="Yama">
      <img src="./assets/items/yami.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./hydra/" aria-label="Open Alchemical Hydra loot simulator" title="Alchemical Hydra">
      <img src="./assets/items/ikkle-hydra.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./cerberus/" aria-label="Open Cerberus loot simulator" title="Cerberus">
      <img src="./assets/items/hellpuppy.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./mad-angel/" aria-label="Open Mad Angel loot simulator" title="Mad Angel">
      <img src="./assets/items/aggy.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./sire/" aria-label="Open Abyssal Sire loot simulator" title="Abyssal Sire">
      <img src="./assets/items/abyssal-orphan.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./amoxliatl/" aria-label="Open Amoxliatl loot simulator" title="Amoxliatl">
      <img src="./assets/items/moxi.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./araxxor/" aria-label="Open Araxxor loot simulator" title="Araxxor">
      <img src="./assets/items/nid.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./barrows/" aria-label="Open Barrows loot simulator" title="Barrows (all six brothers)">
      <img src="./assets/items/dharoks-helm.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./brutus/" aria-label="Open Brutus loot simulator" title="Brutus">
      <img src="./assets/items/beef.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./bryophyta/" aria-label="Open Bryophyta loot simulator" title="Bryophyta">
      <img src="./assets/items/bryophytas-essence.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./obor/" aria-label="Open Obor loot simulator" title="Obor">
      <img src="./assets/items/hill-giant-club.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./callisto-artio/" aria-label="Open Callisto and Artio loot simulator" title="Callisto and Artio">
      <img src="./assets/items/callisto-cub.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./venenatis-spindel/" aria-label="Open Venenatis and Spindel loot simulator" title="Venenatis and Spindel">
      <img src="./assets/items/venenatis-spiderling.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./vetion-calvarion/" aria-label="Open Vet'ion and Calvar'ion loot simulator" title="Vet'ion and Calvar'ion">
      <img src="./assets/items/vetion-jr.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./kalphite-queen/" aria-label="Open Kalphite Queen loot simulator" title="Kalphite Queen">
      <img src="./assets/items/kalphite-princess.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./scurrius/" aria-label="Open Scurrius loot simulator" title="Scurrius">
      <img src="./assets/items/scurry.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./chaos-elemental/" aria-label="Open Chaos Elemental loot simulator" title="Chaos Elemental">
      <img src="./assets/items/pet-chaos-elemental.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./corporeal-beast/" aria-label="Open Corporeal Beast loot simulator" title="Corporeal Beast">
      <img src="./assets/items/pet-dark-core.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./chaos-fanatic/" aria-label="Open Chaos Fanatic loot simulator" title="Chaos Fanatic">
      <img src="./assets/items/odium-shard-1.png" alt="" width="96" height="96">
    </a>
    <a class="boss-tile" href="./crazy-archaeologist/" aria-label="Open Crazy Archaeologist loot simulator" title="Crazy Archaeologist">
      <img src="./assets/items/fedora.png" alt="" width="96" height="96">
    </a>
  </main>
</body>
</html>
